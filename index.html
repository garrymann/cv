  <body>
    <div id="loader">
      <div class="loader-left"></div>
      <div class="loader-right"></div>
      <div class="loader-center">
        <svg class="loader-ring" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="40" />
        </svg>
        <div class="loader-initials">GF</div>
      </div>
    </div>
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: all;
      }
      #loader.open {
        pointer-events: none;
      }
      .loader-left, .loader-right {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50%;
        background: #1f5c45;
        z-index: 9999;
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .loader-left { left: 0; }
      .loader-right { right: 0; }
      #loader.open .loader-left {
        transform: translateX(-100%);
      }
      #loader.open .loader-right {
        transform: translateX(100%);
      }
      .loader-center {
        position: fixed;
        top: 50vh;
        left: 50vw;
        width: 90px;
        height: 90px;
        margin-top: -45px;
        margin-left: -45px;
        z-index: 10000;
      }
      #loader.open .loader-center {
        /* no fade here, initials handle their own zoom */
      }
      #loader.open .loader-ring {
        transition: opacity 0.2s ease;
        transition-delay: 0s;
        opacity: 0;
      }
      #loader.open .loader-initials {
        animation: zoomOut 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0s;
      }
      .loader-content-inner {
        position: relative;
        width: 90px;
        height: 90px;
      }
      .loader-ring {
        width: 90px;
        height: 90px;
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .loader-ring circle {
        fill: none;
        stroke: #c9954a;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 251.3;
        stroke-dashoffset: 251.3;
        animation: fillCircle 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes fillCircle {
        to { stroke-dashoffset: 0; }
      }
      .loader-initials {
        position: absolute;
        inset: 0;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 24px;
        color: #fff;
        letter-spacing: 2px;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes zoomOut {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(5); }
      }
    </style>
    <div id="root"></div>
  </body>
